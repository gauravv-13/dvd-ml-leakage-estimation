# ---------------------------------------------------------------------------
# Single source of truth for the whole project. Every script reads this file.
# ---------------------------------------------------------------------------

assignment:
  # Team assignment from the TAs.
  confirmed: true
  model_file: 32nm_HP.pm        # assigned by TAs
  vdd_nominal: 0.9              # assigned by TAs (V)
  test_circuit: PARITY8         # assigned by TAs: 8-bit parity checker

technology:
  lmin: auto                    # auto = taken from the model file name (e.g. 22nm -> 22e-9)

sampling:                       # spec section 4
  vdd_tolerance: 0.10           # VDD ~ U(vdd_nominal * (1 +/- 0.10))
  temp_range: [-40.0, 125.0]    # deg C
  width_range_lmin: [1.0, 8.0]  # W ~ U(1, 8) * Lmin
  process_tolerance: 0.10       # each process param ~ nominal * U(0.9, 1.1)
  process_params: [vth0, toxe, ndep, u0, xj]

transistor_data:
  n_samples: 10000              # per case
  seed: 2026
  n_jobs: 8                     # parallel ngspice processes

gates:                          # Phase 4 (spec Part B, section 5)
  n_corners: 200                # one corner = VDD, T, NMOS process draw, PMOS process draw
  seed: 4242
  n_jobs: 8                     # parallel ngspice processes
  # Transistor widths in units of Lmin (Wmin = Lmin = 32 nm). Not set by the spec; standard
  # static CMOS sizing as in the lecture slides. AND2 = NAND2 + INV, OR2 = NOR2 + INV sizes.
  widths_lmin:
    inv:   {n: 1, p: 2}
    nand2: {n: 2, p: 2}
    nor2:  {n: 1, p: 4}
  # Phase 5/6 (gate ML): an OFF transistor with |Vds| below this is evaluated at this |Vds| (V).
  # Not set by the spec. In a gate, an OFF device with both ends on one rail sits at 0.1-600 uV,
  # where the OFF training data is almost empty (24 of 10,000 PMOS OFF rows below 1 mV).
  vds_floor_off: 1.0e-3

split:
  seed: 42
  fractions: [0.70, 0.15, 0.15] # train / val / test

rf:
  seed: 2026
