# ---------------------------------------------------------------------------
# Single source of truth for the whole project. Every script reads this file.
# ---------------------------------------------------------------------------

assignment:
  # Team assignment from the TAs.
  confirmed: true
  model_file: 32nm_HP.pm        # assigned by TAs
  vdd_nominal: 0.9              # assigned by TAs (V)
  test_circuit: PARITY8         # assigned by TAs: 8-bit parity checker

technology:
  lmin: auto                    # auto = taken from the model file name (e.g. 22nm -> 22e-9)

sampling:                       # spec section 4
  vdd_tolerance: 0.10           # VDD ~ U(vdd_nominal * (1 +/- 0.10))
  temp_range: [-40.0, 125.0]    # deg C
  width_range_lmin: [1.0, 8.0]  # W ~ U(1, 8) * Lmin
  process_tolerance: 0.10       # each process param ~ nominal * U(0.9, 1.1)
  process_params: [vth0, toxe, ndep, u0, xj]

transistor_data:
  n_samples: 10000              # per case
  seed: 2026
  n_jobs: 8                     # parallel ngspice processes

split:
  seed: 42
  fractions: [0.70, 0.15, 0.15] # train / val / test

rf:
  seed: 2026
